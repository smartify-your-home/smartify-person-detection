configuration:
  image_dir:
    name: Motion-Bildordner
    description: 'Ordner mit den Kamera-Motion-JPEGs. Standard: /homeassistant/www/cam_pt2_motion'
  snapshot_dir:
    name: Snapshot-Ordner
    description: 'Ablage für post_latest.jpg und person_latest.jpg. Standard: /homeassistant/www/smartify_person_detection'
  mqtt_host:
    name: MQTT-Host
    description: 'MQTT-Broker. Standard: core-mosquitto'
  mqtt_port:
    name: MQTT-Port
    description: 'MQTT-Port. Standard: 1883'
  mqtt_username:
    name: MQTT-Benutzer
    description: 'Optionaler MQTT-Benutzer. Standard: leer'
  mqtt_password:
    name: MQTT-Passwort
    description: 'Optionales MQTT-Passwort. Standard: leer'
  mqtt_topic_prefix:
    name: MQTT Topic-Präfix
    description: 'Basis für alle MQTT-Themen dieser App. Standard: smartify_person_detection'
  mqtt_discovery_prefix:
    name: MQTT Discovery-Präfix
    description: 'Home-Assistant-MQTT-Discovery-Präfix. Standard: homeassistant'
  batch_size:
    name: Batch-Größe
    description: 'Anzahl neuer Bilder pro Auswertung. Standard: 3'
  yellow_ratio_threshold:
    name: Gelb-Schwelle
    description: 'Mindestanteil gelber Pixel im Oberkörperbereich. Standard: 0.18'
  person_confidence:
    name: Person-Confidence
    description: 'Normale Mindest-Confidence für eine Person. Standard: 0.45'
  scan_interval_seconds:
    name: Ordnerscan-Intervall
    description: 'Abstand zwischen Scans des Motion-Bildordners in Sekunden. Standard: 2 s'
  partial_batch_timeout_seconds:
    name: Restbatch-Timeout
    description: 'Wenn weniger als die Batch-Größe an stabilen Bildern vorliegt, werden diese nach dieser Wartezeit trotzdem ausgewertet. Dauerhaft instabile Dateien werden danach übersprungen. Standard: 60 s'
  binary_sensor_on_seconds:
    name: Post ON-Zeit
    description: 'Sekunden bis zum automatischen Reset des Post-Binary. 0 deaktiviert den Timer. Standard: 14000 s'
  person_sensor_on_seconds:
    name: Person ON-Zeit
    description: 'Sekunden bis zum automatischen Reset des Person-Binary. 0 deaktiviert den Timer. Standard: 60 s'
  post_auto_reset:
    name: Post Auto-Reset
    description: 'Optionaler Timer-Reset für den Post-Binary-Sensor. Standard: aus'
  person_auto_reset:
    name: Person Auto-Reset
    description: 'Optionaler Timer-Reset für den Person-Binary-Sensor. Standard: aus'
  reset_binaries_at_midnight:
    name: Binaries um Mitternacht zurücksetzen
    description: 'Optionaler Reset der Post-/Person-Binary-Sensoren beim Tageswechsel. Standard: aus'
  rtsp_enabled:
    name: RTSP-Modus aktiv
    description: 'Direkten RTSP-Ringpuffer fuer Ereignisbilder verwenden. Standard: aus'
  rtsp_url:
    name: RTSP-URL
    description: 'Direkte RTSP-Adresse der Kamera. Standard: rtsp://camera.local:554/stream'
  rtsp_username:
    name: RTSP-Benutzer
    description: 'Optionaler RTSP-Benutzer. Standard: leer'
  rtsp_password:
    name: RTSP-Passwort
    description: 'Optionales RTSP-Passwort. Standard: leer'
  rtsp_transport:
    name: RTSP-Transport
    description: 'Transport fuer den Stream. Standard: tcp'
  rtsp_buffer_fps:
    name: RTSP-Puffer-FPS
    description: 'Frames pro Sekunde im Ringpuffer. Standard: 4'
  rtsp_jpeg_quality:
    name: RTSP-JPEG-Qualitaet
    description: 'JPEG-Qualitaet der gepufferten Frames. Standard: 92'
  rtsp_pre_seconds:
    name: RTSP Vorlauf
    description: 'Sekunden vor dem Trigger, die ausgewertet werden. Standard: 2.0 s'
  rtsp_post_seconds:
    name: RTSP Nachlauf
    description: 'Sekunden nach dem Trigger, die ausgewertet werden. Standard: 3.0 s'
  rtsp_analyze_fps:
    name: RTSP Analyse-FPS
    description: 'Wie viele Frames pro Sekunde aus dem Ereignisfenster analysiert werden. Standard: 2.0'
  rtsp_trigger_entities:
    name: RTSP Trigger-Entities
    description: Kommagetrennte HA-Binary-Sensoren, deren off->on den RTSP-Event ausloest.
  rtsp_trigger_poll_seconds:
    name: RTSP Trigger-Abfrage
    description: 'Abfrageintervall der Trigger-Entities. Standard: 0.5 s'
  rtsp_rearm_off_seconds:
    name: RTSP Wieder-Scharfschaltung
    description: 'Nach einem RTSP-Ereignis wird erst wieder scharf geschaltet, wenn alle Trigger-Entities so lange durchgehend OFF sind. Standard: 10 s'
  rtsp_max_files:
    name: RTSP maximale Dateien
    description: 'Maximale Anzahl rotierender rtsp_000.jpg bis rtsp_099.jpg. Standard: 100'
  rtsp_fallback_after_seconds:
    name: RTSP Fallback nach
    description: 'Wenn der RTSP-Stream so lange ausfaellt, wird automatisch der robuste Ordner-Batchmodus aktiv. Standard: 15 s'
  door_use_rtsp:
    name: Tuerpruefung aus RTSP
    description: 'Haustuer/Garage bevorzugt aus dem aktuellen RTSP-Frame pruefen; camera_proxy bleibt Fallback. Standard: aus'
  door_enabled:
    name: Haustürerkennung aktiv
    description: 'Horizontale Haustür-Kantenmessung aktivieren. Standard: aus'
  door_camera_entity:
    name: Kamera-Entity
    description: 'Kamera für Tür- und Garagenprüfungen. Standard: camera.front_door'
  door_check_interval_seconds:
    name: Tür-Prüfintervall
    description: 'Abstand zwischen Kamera-Prüfungen. Minimum intern 5 s. Standard: 60 s'
  door_pause_after_motion_seconds:
    name: Pause nach Motion
    description: 'Tür-/Garagenprüfung nach neuen Motion-Bildern pausieren. Standard: 20 s'
  door_open_shift_pixels:
    name: Haustür offen ab
    description: 'Verschiebung gegenüber der geschlossenen Referenz, ab der OFFEN gilt. Standard: 3.0 px'
  door_close_shift_pixels:
    name: Haustür geschlossen bis
    description: 'Verschiebung, bis zu der GESCHLOSSEN gilt. Standard: 1.5 px'
  door_calibration_ui_minutes:
    name: Kalibrier-UI Freigabedauer
    description: 'Dauer der freigeschalteten Kalibrieroberfläche. Standard: 15 min'
  door_edge_track_window_pixels:
    name: Tracking-Suchfenster
    description: 'Lokaler Suchbereich um die kalibrierte Kante. Standard: ±4.0 px'
  door_edge_min_quality:
    name: Mindest-Kantenqualität
    description: 'Minimale Kantenqualität für gültiges Tracking. Standard: 1.2'
  door_edge_min_template_corr:
    name: Mindest-Profilkorrelation
    description: 'Minimale Ähnlichkeit des Kantenprofils zur Kalibrierung. Standard: 0.45'
  door_name:
    name: Name Haustür
    description: 'Anzeigename der Haustür-Entity. Standard: Haustür'
  door_entity_id:
    name: Entity-ID Haustür
    description: 'Gewünschte Entity-ID. Standard: binary_sensor.haustuer'
  vertical_enabled:
    name: Garagentor 1 aktiv
    description: 'Erste vertikale Kantenmessung aktivieren. Standard: aus'
  vertical_name:
    name: Name Garagentor 1
    description: 'Anzeigename. Standard: Garagentor'
  vertical_entity_id:
    name: Entity-ID Garagentor 1
    description: 'Gewünschte Entity-ID. Standard: binary_sensor.garagentor'
  vertical_open_shift_pixels:
    name: Garagentor 1 offen ab
    description: 'Vertikale Verschiebung ab der OFFEN gilt. Standard: 3.0 px'
  vertical_close_shift_pixels:
    name: Garagentor 1 geschlossen bis
    description: 'Vertikale Verschiebung bis zu der GESCHLOSSEN gilt. Standard: 1.5 px'
  post_entity_id:
    name: Entity-ID Post
    description: 'Gewünschte Entity-ID des Post-Binary-Sensors. Standard: binary_sensor.smartify_person_detection_post'
  person_entity_id:
    name: Entity-ID Person
    description: 'Gewünschte Entity-ID des Person-Binary-Sensors. Standard: binary_sensor.smartify_person_detection_person'
  vertical2_enabled:
    name: Garagentor 2 aktiv
    description: 'Zweite vertikale Kantenmessung aktivieren. Standard: aus'
  vertical2_name:
    name: Name Garagentor 2
    description: 'Anzeigename. Standard: Garagentor 2'
  vertical2_entity_id:
    name: Entity-ID Garagentor 2
    description: 'Gewünschte Entity-ID. Standard: binary_sensor.garagentor_2'
  vertical2_open_shift_pixels:
    name: Garagentor 2 offen ab
    description: 'Vertikale Verschiebung ab der OFFEN gilt. Standard: 3.0 px'
  vertical2_close_shift_pixels:
    name: Garagentor 2 geschlossen bis
    description: 'Vertikale Verschiebung bis zu der GESCHLOSSEN gilt. Standard: 1.5 px'
  sound_enabled:
    name: Erkennungston Startzustand
    description: 'Startzustand des globalen Sound-Schalters bei der ersten Einrichtung. Danach kann der Schalter direkt in Home Assistant bedient werden. Standard: aus'
  sound_media_player:
    name: Mediaplayer für Erkennungston
    description: Home-Assistant-Entity, z. B. media_player.wohnzimmer. Leer = keine Wiedergabe.
  person_sound:
    name: Ton für Person
    description: Pfad oder URL für Person-Erkennung, z. B. /local/sounds/person.mp3.
  post_sound:
    name: Ton für Post
    description: Pfad oder URL für Post-Erkennung, z. B. /local/sounds/post.mp3.
  sound_base_url:
    name: Home-Assistant Basis-URL für Sounds
    description: Optional, z. B. http://192.168.2.10:8123. Bei /local/... wird sonst automatisch internal_url/external_url von Home Assistant verwendet.
  sound_media_content_type:
    name: Sound Medientyp
    description: 'media_content_type für media_player.play_media. Standard: music'
  sound_time_window_enabled:
    name: Sound-Zeitbereich aktiv
    description: 'Ton nur innerhalb des erlaubten Zeitbereichs ausgeben. Zeitfenster über Mitternacht werden unterstützt. Standard: aus'
  sound_time_start:
    name: Sound erlaubt ab
    description: 'Beginn des erlaubten Zeitbereichs im Format HH:MM. Standard: 07:00'
  sound_time_end:
    name: Sound erlaubt bis
    description: 'Ende des erlaubten Zeitbereichs im Format HH:MM. Standard: 22:00'
