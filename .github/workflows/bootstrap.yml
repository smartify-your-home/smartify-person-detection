name: Bootstrap repository

on:
  push:
    paths:
      - ".bootstrap/READY"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode prepared repository
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part_*.txt > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/smartify-person-detection.zip
          unzip -t /tmp/smartify-person-detection.zip
          rm -rf /tmp/smartify-person-detection
          mkdir -p /tmp/smartify-person-detection
          unzip -q /tmp/smartify-person-detection.zip -d /tmp/smartify-person-detection
          rsync -a /tmp/smartify-person-detection/ ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          test -f repository.yaml
          test -f smartify_person_detection/config.yaml
          test -f smartify_person_detection/app.py
          python3 -m py_compile smartify_person_detection/app.py smartify_person_detection/rtsp_source.py
          grep -q 'version: 1.6.0' smartify_person_detection/config.yaml
          grep -q 'slug: smartify_person_detection' smartify_person_detection/config.yaml
          grep -q 'sound_enabled: false' smartify_person_detection/config.yaml
          grep -q 'post_auto_reset: false' smartify_person_detection/config.yaml
          grep -q 'person_auto_reset: false' smartify_person_detection/config.yaml
          grep -q 'reset_binaries_at_midnight: false' smartify_person_detection/config.yaml

      - name: Commit prepared repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Smartify Person Detection 1.6.0"
          git push
