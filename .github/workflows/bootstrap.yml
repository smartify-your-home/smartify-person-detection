name: Bootstrap repository

on:
  push:
    paths:
      - ".bootstrap/payload.b64"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode prepared repository
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .bootstrap/payload.b64 > /tmp/smartify-person-detection.zip
          rm -rf /tmp/smartify-person-detection
          mkdir -p /tmp/smartify-person-detection
          unzip -q /tmp/smartify-person-detection.zip -d /tmp/smartify-person-detection
          rsync -a /tmp/smartify-person-detection/ ./
          rm -rf .bootstrap
      - name: Commit prepared repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Release Smartify Person Detection 1.6.0"
          git push
